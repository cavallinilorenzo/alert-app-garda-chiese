name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'

env:
  REGISTRY: ghcr.io
  # Usiamo stringhe minuscole per i tag
  REPO_LC: cavallinilorenzo/alert-app-garda-chiese

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:latest

      - name: Build and push Nginx/Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/nginx:latest
