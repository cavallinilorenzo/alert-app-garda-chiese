openapi: 3.1.0
info:
  title: Hack4Water Alert - Consorzio di bonifica Garda Chiese
  version: 1.0.0
  description: API per l'App di segnalazione (pubblica) e il Portale operatore (privato).
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NonAutenticato:
      description: Token mancante, scaduto o non valido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            non_autenticato:
              value:
                code: "non_autenticato"
                message: "Accedi per continuare."
                fields: {}
    SegnalazioneNonTrovata:
      description: Nessuna Segnalazione con questo id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            non_trovata:
              value:
                code: "non_trovata"
                message: "Segnalazione non trovata."
                fields: {}
  examples:
    SegnalazioneInVerifica:
      summary: Presa in carico, con la categoria corretta e un Duplicato collegato
      value:
        id: 123
        codice_pratica: "GCH-4B29"
        stato_corrente: "in_verifica"
        esito: ""
        priorita: "alta"
        priorita_calcolata: "alta"
        override_motivazione: ""
        created_at: "2026-09-24T08:50:00Z"
        lat: 45.31095
        lng: 10.625391
        lat_originale: null
        lng_originale: null
        descrizione: "Il canale esce sulla strada in via Brescia"
        cellulare: "+39 339 4637252"
        transcript_ai: "Il canale in via Brescia sta uscendo sulla strada, adesso."
        foto: ["/media/segnalazioni/gch-4b29.jpg"]
        categoria: "canale_che_tracima"
        categoria_originale: "ostruzione"
        durata: "adesso"
        quantita_acqua: "molta_acqua"
        pericolo_persone: "no"
        pericolo_strada: "si"
        pericolo_edifici: "non_so"
        estratti_confidenza:
          categoria: 0.62
          durata: 0.91
          pericolo_strada: 0.88
        layer: "canale"
        nome_tracciato: "III ramo C"
        nome_completo_tracciato: "Dispensatore III ramo C"
        tipo_tracciato: "Dispensatore"
        distanza_m: 12.5
        zona_id: 19
        acquaiolo_competente_id: 7
        operatore_riferimento:
          id: 1
          nome_completo: "Mario Rossi"
        is_duplicato: false
        duplicato_di: null
        duplicati:
          - id: 131
            codice_pratica: "GCH-9K2M"
            cellulare: "+39 347 1180254"
            foto: ["/media/segnalazioni/gch-9k2m.jpg"]
            created_at: "2026-09-24T09:05:00Z"
        messaggio_al_segnalante: ""
        registro:
          - id: 501
            tipo_evento: "cambio_stato"
            stato: "ricevuta"
            operatore: null
            nota: ""
            created_at: "2026-09-24T08:50:00Z"
          - id: 502
            tipo_evento: "cambio_stato"
            stato: "in_verifica"
            operatore:
              id: 1
              nome_completo: "Mario Rossi"
            nota: ""
            created_at: "2026-09-24T09:12:00Z"
          - id: 503
            tipo_evento: "correzione_campo"
            stato: "in_verifica"
            operatore:
              id: 1
              nome_completo: "Mario Rossi"
            nota: "Modificati: categoria"
            created_at: "2026-09-24T09:14:00Z"
          - id: 504
            tipo_evento: "duplicato_collegato"
            stato: "in_verifica"
            operatore:
              id: 1
              nome_completo: "Mario Rossi"
            nota: "GCH-9K2M"
            created_at: "2026-09-24T09:20:00Z"
          - id: 505
            tipo_evento: "nota"
            stato: "in_verifica"
            operatore:
              id: 1
              nome_completo: "Mario Rossi"
            nota: "Chiamato il segnalante, conferma la posizione."
            created_at: "2026-09-24T09:25:00Z"
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - fields
      properties:
        code:
          type: string
          example: fuori_perimetro
        message:
          type: string
          example: "Il punto indicato è troppo distante dal reticolo consortile."
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SegnalazioneStatoPubblico:
      type: object
      description: |
        Quello che vede chi ha il link della Pagina di stato, senza login. Oltre allo Stato
        c'è un riassunto della Segnalazione (codice, foto, categoria, luogo, data d'invio)
        per riconoscerla quando si riapre il link. Il cellulare e la descrizione non ci sono.
      required:
        - codice_pratica
        - created_at
        - foto
        - categoria
        - comune
        - nome_completo_tracciato
        - stato_corrente
        - is_duplicato
        - timeline
      properties:
        codice_pratica:
          type: string
        created_at:
          type: string
          format: date-time
          description: Data d'invio.
        foto:
          type: array
          description: |
            Le foto inviate. Chiunque abbia il token le può vedere: gli URL si aprono senza JWT.
          items:
            type: string
            description: URL dell'immagine.
        categoria:
          type: string
          enum: [acqua_che_affiora, canale_che_tracima, argine_danneggiato, ostruzione, paratoia_danneggiata, acqua_sporca, altro, ""]
          description: La categoria attuale, anche se l'Operatore l'ha corretta. Vuota se non indicata.
        comune:
          type: string
          description: Il comune del punto segnalato. Vuoto se non si riesce a ricavarlo.
        nome_completo_tracciato:
          type: string
          description: Il tracciato più vicino, come nella scheda del Portale operatore.
        stato_corrente:
          type: string
          enum: [ricevuta, in_verifica, assegnata, in_intervento, chiusa]
        is_duplicato:
          type: boolean
        messaggio_al_segnalante:
          type: string
        timeline:
          type: array
          items:
            type: object
            properties:
              stato:
                type: string
              data:
                type: string
                format: date-time

    Stato:
      type: string
      enum: [ricevuta, in_verifica, assegnata, in_intervento, chiusa]

    Priorita:
      type: string
      enum: [bassa, media, alta, critica]

    Esito:
      type: string
      enum: [risolta, duplicata, non_di_competenza, non_riscontrata, falsa]

    Operatore:
      type: object
      required: [id, nome_completo]
      properties:
        id:
          type: integer
        nome_completo:
          type: string
          example: "Mario Rossi"

    Evento:
      type: object
      description: Una voce del Registro. Il Registro si aggiunge e basta.
      required: [id, tipo_evento, stato, operatore, nota, created_at]
      properties:
        id:
          type: integer
        tipo_evento:
          type: string
          enum: [cambio_stato, correzione_campo, nota, duplicato_collegato]
        stato:
          description: Lo Stato della Segnalazione dopo l'evento.
          $ref: '#/components/schemas/Stato'
        operatore:
          description: Null per l'evento `ricevuta` scritto all'invio.
          oneOf:
            - $ref: '#/components/schemas/Operatore'
            - type: "null"
        nota:
          type: string
          description: Vuota se l'Operatore non l'ha scritta. Per `correzione_campo` elenca i campi modificati.
        created_at:
          type: string
          format: date-time

    DuplicatoCollegato:
      type: object
      description: Una Segnalazione chiusa con esito `duplicata` e collegata a questa.
      required: [id, codice_pratica, cellulare, foto, created_at]
      properties:
        id:
          type: integer
        codice_pratica:
          type: string
        cellulare:
          type: string
        foto:
          type: array
          items:
            type: string
            description: URL dell'immagine.
        created_at:
          type: string
          format: date-time

    SegnalazioneDettaglio:
      type: object
      description: |
        La scheda della Segnalazione nel Portale operatore. I campi testuali non compilati
        sono stringhe vuote; quelli numerici o i collegamenti non presenti sono `null`.
      required:
        - id
        - codice_pratica
        - stato_corrente
        - esito
        - priorita
        - priorita_calcolata
        - override_motivazione
        - created_at
        - lat
        - lng
        - lat_originale
        - lng_originale
        - descrizione
        - cellulare
        - transcript_ai
        - foto
        - categoria
        - categoria_originale
        - durata
        - quantita_acqua
        - pericolo_persone
        - pericolo_strada
        - pericolo_edifici
        - estratti_confidenza
        - layer
        - nome_tracciato
        - nome_completo_tracciato
        - tipo_tracciato
        - distanza_m
        - zona_id
        - acquaiolo_competente_id
        - operatore_riferimento
        - is_duplicato
        - duplicato_di
        - duplicati
        - messaggio_al_segnalante
        - registro
      properties:
        id:
          type: integer
        codice_pratica:
          type: string
        stato_corrente:
          $ref: '#/components/schemas/Stato'
        esito:
          type: string
          enum: [risolta, duplicata, non_di_competenza, non_riscontrata, falsa, ""]
          description: Vuoto finché la Segnalazione non è Chiusa.
        priorita:
          $ref: '#/components/schemas/Priorita'
        priorita_calcolata:
          description: La priorità calcolata all'invio; resta invariata se l'Operatore la cambia.
          $ref: '#/components/schemas/Priorita'
        override_motivazione:
          type: string
          description: Perché l'Operatore ha cambiato la priorità calcolata. Vuota se non l'ha cambiata.
        created_at:
          type: string
          format: date-time
        lat:
          type: number
        lng:
          type: number
        lat_originale:
          type: [number, "null"]
          description: Posizione GPS inviata dal Segnalante, conservata alla prima correzione. Null se mai corretta.
        lng_originale:
          type: [number, "null"]
        descrizione:
          type: string
        cellulare:
          type: string
        transcript_ai:
          type: string
        foto:
          type: array
          items:
            type: string
            description: URL dell'immagine.
        categoria:
          type: string
          enum: [acqua_che_affiora, perdita_dal_canale, canale_che_tracima, argine_danneggiato, ostruzione, canale_asciutto, paratoia_danneggiata, acqua_sporca, altro, ""]
        categoria_originale:
          type: string
          enum: [acqua_che_affiora, perdita_dal_canale, canale_che_tracima, argine_danneggiato, ostruzione, canale_asciutto, paratoia_danneggiata, acqua_sporca, altro, ""]
          description: Categoria inviata, conservata alla prima correzione. Vuota se mai corretta.
        durata:
          type: string
          enum: [adesso, alcune_ore, piu_di_un_giorno, da_settimane, non_so, ""]
        quantita_acqua:
          type: string
          enum: [gocce, piccolo_flusso, molta_acqua, getto, non_so, non_applicabile, ""]
        pericolo_persone:
          type: string
          enum: ["si", "no", "non_so", ""]
        pericolo_strada:
          type: string
          enum: ["si", "no", "non_so", ""]
        pericolo_edifici:
          type: string
          enum: ["si", "no", "non_so", ""]
        estratti_confidenza:
          type: object
          description: Confidenza dell'estrazione vocale per campo, da 0 a 1. Vuoto se il form è stato compilato a mano.
          additionalProperties:
            type: number
        layer:
          type: string
          enum: [canale, condotta, reticolo_principale, ""]
          description: Layer del tracciato più vicino.
        nome_tracciato:
          type: string
        nome_completo_tracciato:
          type: string
        tipo_tracciato:
          type: string
        distanza_m:
          type: [number, "null"]
          description: Distanza dal tracciato più vicino.
        zona_id:
          type: [integer, "null"]
          description: Zona acquaiolo in cui cade la posizione.
        acquaiolo_competente_id:
          type: [integer, "null"]
          description: Id dell'Acquaiolo nella Rubrica acquaioli (`/acquaioli`), da cui si prende il telefono.
        operatore_riferimento:
          oneOf:
            - $ref: '#/components/schemas/Operatore'
            - type: "null"
        is_duplicato:
          type: boolean
        duplicato_di:
          type: [integer, "null"]
          description: Id dell'originale, se questa Segnalazione è un Duplicato.
        duplicati:
          type: array
          description: I Duplicati collegati a questa Segnalazione ("segnalata anche da N persone").
          items:
            $ref: '#/components/schemas/DuplicatoCollegato'
        messaggio_al_segnalante:
          type: string
        registro:
          type: array
          description: In ordine cronologico, dal più vecchio.
          items:
            $ref: '#/components/schemas/Evento'

    Acquaiolo:
      type: object
      required: [id, nome, telefono, zona_id]
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          example: "BRIGNANI"
        telefono:
          type: string
          example: "+39 333 7654321"
        zona_id:
          type: [integer, "null"]
          description: Identificativo della Zona acquaiolo nel KML.
          example: 21

    AcquaioloInput:
      type: object
      required: [nome, telefono]
      properties:
        nome:
          type: string
        telefono:
          type: string
        zona_id:
          type: [integer, "null"]

    FeatureTracciato:
      type: object
      description: Un tracciato del Reticolo consortile (layer `canale`, `condotta`, `reticolo_principale`).
      required: [type, id, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: string
          description: Id del placemark nel KML.
          example: "RIB_Canali_2026.68"
        properties:
          type: object
          required: [nome, nome_completo, tipo, codice]
          properties:
            nome:
              type: string
            nome_completo:
              type: string
            tipo:
              type: [string, "null"]
            codice:
              type: [string, "null"]
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [LineString, MultiLineString]
            coordinates:
              type: array
              description: Coordinate `[lng, lat]` in WGS84, semplificate a 5 m.

    FeatureZonaAcquaiolo:
      type: object
      description: Una Zona acquaiolo (layer `zona_acquaiolo`).
      required: [type, id, properties, geometry]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: integer
          description: Lo stesso `zona_id` di `/perimetro/check` e della Rubrica acquaioli.
          example: 19
        properties:
          type: object
          required: [nome, servita, acquaiolo]
          properties:
            nome:
              type: string
              description: Macro-zona.
            servita:
              type: boolean
            acquaiolo:
              type: [string, "null"]
              description: Null se la zona è `NON SERVITA`.
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
              description: Coordinate `[lng, lat]` in WGS84, semplificate a 5 m.

    LayerGeoJSON:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/FeatureTracciato'
              - $ref: '#/components/schemas/FeatureZonaAcquaiolo'

paths:
  /perimetro/check:
    post:
      summary: Controllo perimetro (App)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                lng:
                  type: number
      responses:
        '200':
          description: Esito del controllo
          content:
            application/json:
              schema:
                type: object
                required: [accettato, distanza_m, messaggio]
                properties:
                  accettato:
                    type: boolean
                  distanza_m:
                    type: number
                  zona_id:
                    type: integer
                  messaggio:
                    type: string
              examples:
                accettato:
                  value:
                    accettato: true
                    distanza_m: 12.5
                    zona_id: 4
                    messaggio: "Punto valido nel comune di Mantova."
        '400':
          description: Coordinate mancanti, non numeriche o fuori range (`lat` tra -90 e 90, `lng` tra -180 e 180)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                dati_non_validi:
                  value:
                    code: "dati_non_validi"
                    message: "I dati inviati non sono validi."
                    fields:
                      lng: ["Questo campo è obbligatorio."]

  /layer/{layer}.geojson:
    get:
      operationId: layerGeoJSON
      summary: Layer GeoJSON del Reticolo consortile e delle Zone acquaiolo (App e Portale operatore)
      description: Layer statico per disegnare la mappa con Leaflet. Le geometrie sono semplificate e servono solo al disegno.
      security: []
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
            enum: [canale, condotta, reticolo_principale, zona_acquaiolo]
      responses:
        '200':
          description: FeatureCollection del layer
          headers:
            Cache-Control:
              schema:
                type: string
              example: "public, max-age=86400"
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/LayerGeoJSON'
              examples:
                canale:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        id: "RIB_Canali_2026.68"
                        properties:
                          nome: "III ramo C"
                          nome_completo: "Dispensatore III ramo C"
                          tipo: "Dispensatore"
                          codice: "3203c"
                        geometry:
                          type: LineString
                          coordinates: [[10.625391, 45.31095], [10.627453, 45.310316]]
                condotta:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        id: "RIB_Condotte_2026.13"
                        properties:
                          nome: "COLOMBAROLA - CAVALLARA"
                          nome_completo: "Condotta COLOMBAROLA - CAVALLARA"
                          tipo: "Condotta"
                          codice: null
                        geometry:
                          type: LineString
                          coordinates: [[10.65994, 45.353735], [10.661367, 45.353654], [10.661776, 45.355696], [10.662156, 45.357027], [10.662306, 45.357058], [10.662238, 45.358196], [10.662065, 45.358512], [10.660131, 45.359729], [10.659937, 45.360363], [10.659597, 45.361014], [10.658786, 45.361454]]
                reticolo_principale:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        id: "RIP_2026.17"
                        properties:
                          nome: "CACCIABELLA - AIPO"
                          nome_completo: "Vaso CACCIABELLA - AIPO"
                          tipo: "Vaso"
                          codice: "7003"
                        geometry:
                          type: LineString
                          coordinates: [[10.406885, 45.220643], [10.406947, 45.219672], [10.406389, 45.214738], [10.406688, 45.214221], [10.406691, 45.213941], [10.406846, 45.213685]]
                zona_acquaiolo:
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        id: 19
                        properties:
                          nome: "Alto Mantovano"
                          servita: true
                          acquaiolo: "PEGORARO L"
                        geometry:
                          type: Polygon
                          coordinates: [[[10.481381, 45.368262], [10.497071, 45.384636], [10.536655, 45.366689], [10.534789, 45.360666], [10.523236, 45.358376], [10.507222, 45.330771], [10.49796, 45.359868], [10.481381, 45.368262]]]
                      - type: Feature
                        id: 21
                        properties:
                          nome: "Alto Mantovano"
                          servita: false
                          acquaiolo: null
                        geometry:
                          type: Polygon
                          coordinates: [[[10.465021, 45.403491], [10.484205, 45.397158], [10.485856, 45.405412], [10.498563, 45.382725], [10.481381, 45.368262], [10.451632, 45.386567], [10.465021, 45.403491]]]
        '404':
          description: Layer inesistente

  /estrazione/vocale:
    post:
      summary: Estrazione strutturata da audio (App)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: |
                    Registrazione di MediaRecorder o file audio, al massimo 10 MB. Formati:
                    `audio/webm`, `audio/ogg`, `audio/mp4`, `audio/m4a`, `audio/x-m4a`, `audio/aac`,
                    `audio/mpeg`, `audio/mp3`, `audio/wav`, `audio/x-wav`, `audio/flac`
                    (parametri come `;codecs=opus` ammessi).
      responses:
        '200':
          description: |
            Dati estratti. In `campi` ci sono solo i campi detti dal Segnalante; quelli non
            detti sono in `mancanti`, da compilare a mano nel form.
          content:
            application/json:
              schema:
                type: object
                required: [transcript, campi, mancanti]
                properties:
                  transcript:
                    type: string
                  campi:
                    type: object
                    properties:
                      categoria:
                        type: string
                        enum: [acqua_che_affiora, perdita_dal_canale, canale_che_tracima, argine_danneggiato, ostruzione, canale_asciutto, paratoia_danneggiata, acqua_sporca, altro]
                      descrizione:
                        type: string
                        maxLength: 500
                      durata:
                        type: string
                        enum: [adesso, alcune_ore, piu_di_un_giorno, da_settimane, non_so]
                      quantita_acqua:
                        type: string
                        enum: [gocce, piccolo_flusso, molta_acqua, getto, non_so, non_applicabile]
                        description: non_applicabile se la categoria non prevede la domanda sulla quantità d'acqua.
                      pericolo_persone:
                        type: string
                        enum: ["si", "no", "non_so"]
                      pericolo_strada:
                        type: string
                        enum: ["si", "no", "non_so"]
                      pericolo_edifici:
                        type: string
                        enum: ["si", "no", "non_so"]
                  mancanti:
                    type: array
                    items:
                      type: string
                      enum: [categoria, descrizione, durata, quantita_acqua, pericolo_persone, pericolo_strada, pericolo_edifici]
              examples:
                success:
                  value:
                    transcript: "Il canale in via Brescia sta uscendo sulla strada, adesso."
                    campi:
                      categoria: "canale_che_tracima"
                      descrizione: "Il canale esce sulla strada in via Brescia"
                      durata: "adesso"
                      pericolo_strada: "si"
                    mancanti: ["quantita_acqua", "pericolo_persone", "pericolo_edifici"]
        '400':
          description: Audio mancante, vuoto o in un formato non supportato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                audio_non_valido:
                  value:
                    code: "audio_non_valido"
                    message: "Formato audio non supportato."
                    fields:
                      audio: ["Formato audio non supportato."]
        '413':
          description: Audio oltre i 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                audio_troppo_grande:
                  value:
                    code: "audio_troppo_grande"
                    message: "La registrazione è troppo lunga."
                    fields:
                      audio: ["La registrazione supera i 10 MB."]
        '503':
          description: Assistente vocale non disponibile (provider che non risponde o non configurato); il Segnalante compila il form a mano
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                estrazione_non_disponibile:
                  value:
                    code: "estrazione_non_disponibile"
                    message: "L'assistente vocale non è disponibile: compila il modulo a mano."
                    fields: {}

  /estrazione/foto:
    post:
      summary: Controllo di pertinenza ed estrazione dalla foto (App)
      description: |
        L'App lo chiama subito dopo lo scatto. Se la foto non è pertinente al reticolo
        consortile va scartata e rifatta. Se è pertinente, i `campi` visti nella foto
        completano quelli che il Segnalante non dice a voce o non sceglie a mano; quello che
        dice il Segnalante ha sempre la precedenza.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
                  description: |
                    La foto del problema, al massimo 10 MB. Formati: `image/jpeg`, `image/png`,
                    `image/webp`, `image/heic`, `image/heif`.
      responses:
        '200':
          description: |
            Esito dell'analisi. In `campi` ci sono solo i campi che si vedono con sicurezza
            nella foto; se la foto non è pertinente `campi` è vuoto e `motivo` spiega al
            Segnalante cosa fotografare.
          content:
            application/json:
              schema:
                type: object
                required: [pertinente, motivo, campi]
                properties:
                  pertinente:
                    type: boolean
                  motivo:
                    type: [string, "null"]
                    description: Messaggio per il Segnalante se la foto non è pertinente, altrimenti null.
                  campi:
                    type: object
                    description: |
                      La durata non si ricava da una foto; un pericolo compare solo quando si
                      vede (una foto non basta a escluderlo).
                    properties:
                      categoria:
                        type: string
                        enum: [acqua_che_affiora, perdita_dal_canale, canale_che_tracima, argine_danneggiato, ostruzione, canale_asciutto, paratoia_danneggiata, acqua_sporca, altro]
                      descrizione:
                        type: string
                        maxLength: 500
                      quantita_acqua:
                        type: string
                        enum: [gocce, piccolo_flusso, molta_acqua, getto]
                      pericolo_strada:
                        type: string
                        enum: ["si"]
                      pericolo_edifici:
                        type: string
                        enum: ["si"]
              examples:
                pertinente:
                  value:
                    pertinente: true
                    motivo: null
                    campi:
                      categoria: "canale_che_tracima"
                      descrizione: "Il canale è uscito dagli argini e l'acqua copre la strada sterrata"
                      quantita_acqua: "molta_acqua"
                      pericolo_strada: "si"
                non_pertinente:
                  value:
                    pertinente: false
                    motivo: "Nella foto si vede l'interno di una stanza. Fotografa il canale o il punto dove vedi l'acqua."
                    campi: {}
        '400':
          description: Foto mancante, vuota o in un formato non supportato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                foto_non_valida:
                  value:
                    code: "foto_non_valida"
                    message: "Formato della foto non supportato."
                    fields:
                      foto: ["Formato della foto non supportato."]
        '413':
          description: Foto oltre i 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                foto_troppo_grande:
                  value:
                    code: "foto_troppo_grande"
                    message: "La foto è troppo pesante."
                    fields:
                      foto: ["La foto supera i 10 MB."]
        '503':
          description: Analisi non disponibile (provider che non risponde o non configurato); l'App tiene la foto senza analisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                estrazione_non_disponibile:
                  value:
                    code: "estrazione_non_disponibile"
                    message: "Non riusciamo a controllare la foto in questo momento."
                    fields: {}

  /segnalazioni:
    post:
      summary: Invio della segnalazione (App)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [lat, lng, foto, descrizione, cellulare]
              properties:
                lat:
                  type: number
                lng:
                  type: number
                foto:
                  type: string
                  format: binary
                descrizione:
                  type: string
                  minLength: 10
                  maxLength: 500
                cellulare:
                  type: string
                transcript_ai:
                  type: string
                categoria:
                  type: string
                  enum: [acqua_che_affiora, perdita_dal_canale, canale_che_tracima, argine_danneggiato, ostruzione, canale_asciutto, paratoia_danneggiata, acqua_sporca, altro]
                durata:
                  type: string
                  enum: [adesso, alcune_ore, piu_di_un_giorno, da_settimane, non_so]
                quantita_acqua:
                  type: string
                  enum: [gocce, piccolo_flusso, molta_acqua, getto, non_so, non_applicabile]
                  description: |
                    Si chiede solo per acqua_che_affiora, perdita_dal_canale, canale_che_tracima e
                    argine_danneggiato; per le altre categorie vale non_applicabile.
                pericolo_persone:
                  type: string
                  enum: ["si", "no", "non_so"]
                pericolo_strada:
                  type: string
                  enum: ["si", "no", "non_so"]
                pericolo_edifici:
                  type: string
                  enum: ["si", "no", "non_so"]
                estratti_confidenza:
                  type: string
