services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/cavallinilorenzo/alert-app-garda-chiese/backend:latest
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-garda-chiese.simonetrentin.me,192.168.58.15,localhost,127.0.0.1}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODELLO=${GEMINI_MODELLO}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media

  nginx:
    image: ghcr.io/cavallinilorenzo/alert-app-garda-chiese/nginx:latest
    restart: unless-stopped
    ports:
      # Modifica "8080:80" se vuoi esporre Nginx su un'altra porta dell'host
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - static_data:/srv/backend/static:ro
      - media_data:/srv/backend/media:ro

volumes:
  postgres_data:
  static_data:
  media_data:
