[project]
name = "backend"
version = "0.1.0"
description = "Backend Django dell'alert app Garda Chiese"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.12",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "google-genai>=2.25.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
